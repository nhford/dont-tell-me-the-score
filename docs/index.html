<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Spoiler-safe Villa recap player. No score.">
  <meta property="og:title" content="Villa recap">
  <meta property="og:description" content="Spoiler-safe watch page. No score.">
  <title>Villa recap</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0b0c;
      color: #ececec;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #player { position: fixed; inset: 0; }
    #player iframe { width: 100%; height: 100%; }
    #cover, #done, #missing {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: #0b0b0c;
      z-index: 5;
    }
    #done, #missing { display: none; }
    p { max-width: 28rem; line-height: 1.45; }
  </style>
</head>
<body>
  <div id="cover">
    <p>Starting the recap. The first couple of seconds stay covered so the title and still image cannot spoil it.</p>
  </div>
  <div id="missing">
    <p>No recap is loaded. Open this page from your email.</p>
  </div>
  <div id="done">
    <p>That's the recap. Close this tab so YouTube cannot show other matches.</p>
  </div>
  <div id="player"></div>
  <script>
    const videoId = (location.hash || "").replace(/^#/, "").split("&")[0];
    const cover = document.getElementById("cover");
    const missing = document.getElementById("missing");
    const done = document.getElementById("done");
    const playerHost = document.getElementById("player");

    if (!videoId) {
      cover.style.display = "none";
      missing.style.display = "flex";
    } else {
      const tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(tag);

      let player;
      window.onYouTubeIframeAPIReady = function () {
        player = new YT.Player("player", {
          videoId,
          playerVars: {
            autoplay: 1,
            controls: 1,
            modestbranding: 1,
            rel: 0,
            fs: 1,
            iv_load_policy: 3,
            playsinline: 1,
            origin: location.origin
          },
          events: {
            onReady: function (event) {
              event.target.playVideo();
              window.setTimeout(function () {
                if (cover) cover.style.display = "none";
              }, 4500);
            },
            onStateChange: function (event) {
              if (event.data === YT.PlayerState.ENDED) {
                playerHost.innerHTML = "";
                cover.style.display = "none";
                done.style.display = "flex";
              }
            }
          }
        });
      };
    }
  </script>
</body>
</html>
