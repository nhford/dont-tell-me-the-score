<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Spoiler-safe Premier League recaps. No scores.">
  <meta property="og:title" content="DTMTS">
  <meta property="og:description" content="Don't tell me the score.">
  <title>DTMTS</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #111;
      --muted: #8a8a8a;
      --bg: #f3f3f3;
      --line: #dcdcdc;
      --badge: 52px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 22px 12px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    .brand {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }
    .sub {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    main { padding: 18px 0 48px; }
    .day {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 16px;
      align-items: start;
      padding: 16px 22px;
    }
    .date-label {
      background: #111;
      color: #fff;
      border-radius: 4px;
      padding: 8px 6px;
      text-align: center;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 0.06em;
      line-height: 1.15;
    }
    .date-label span { display: block; font-size: 22px; }
    .games {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      min-height: var(--badge);
    }
    .badge, .empty {
      width: var(--badge);
      height: var(--badge);
      border-radius: 50%;
      border: 0;
      padding: 0;
      overflow: hidden;
      position: relative;
      background: #fff;
      box-shadow: 0 0 0 1px #e6e6e6;
    }
    .badge { cursor: pointer; }
    .badge:hover { transform: scale(1.06); }
    .half {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
    }
    .half.home { left: 0; }
    .half.away { right: 0; }
    .half img {
      width: 78%;
      height: 78%;
      object-fit: contain;
    }
    .empty {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #bbb;
      font-size: 28px;
      font-weight: 300;
    }
    #player-layer {
      display: none;
      position: fixed;
      inset: 0;
      background: #0b0b0c;
      color: #ececec;
      z-index: 20;
    }
    #player { position: absolute; inset: 0; }
    #player iframe { width: 100%; height: 100%; }
    #cover, #done {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: #0b0b0c;
      z-index: 5;
    }
    #done { display: none; }
    #back {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 6;
      background: transparent;
      color: #ececec;
      border: 1px solid #444;
      border-radius: 999px;
      padding: 6px 12px;
      cursor: pointer;
    }
    p { max-width: 28rem; line-height: 1.45; }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="brand">DTMTS</div>
      <div class="sub">Don't tell me the score</div>
    </div>
  </header>
  <main id="grid"></main>
  <div id="player-layer">
    <button id="back" type="button">Back</button>
    <div id="cover">
      <p>Starting the recap. The first couple of seconds stay covered so the title and still image cannot spoil it.</p>
    </div>
    <div id="done">
      <p>That's the recap. Close this player so YouTube cannot show other matches.</p>
    </div>
    <div id="player"></div>
  </div>
  <script>
    const MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
    const grid = document.getElementById("grid");
    const layer = document.getElementById("player-layer");
    const cover = document.getElementById("cover");
    const done = document.getElementById("done");
    const playerHost = document.getElementById("player");
    const back = document.getElementById("back");
    let ytReady = false;
    let player;

    function isoDate(d) {
      return d.toISOString().slice(0, 10);
    }

    function lastFiveDays() {
      const days = [];
      const now = new Date();
      for (let i = 0; i < 5; i += 1) {
        const d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() - i));
        days.push(isoDate(d));
      }
      return days;
    }

    function dateLabel(iso) {
      const d = new Date(iso + "T00:00:00Z");
      return { month: MONTHS[d.getUTCMonth()], day: String(d.getUTCDate()) };
    }

    function badge(recap, teams) {
      const button = document.createElement("button");
      button.className = "badge";
      button.type = "button";
      button.setAttribute("aria-label", "Watch recap");
      const home = teams[recap.home] || {};
      const away = teams[recap.away] || {};
      button.innerHTML =
        '<span class="half home"><img alt="" src="' + (home.logo || "") + '"></span>' +
        '<span class="half away"><img alt="" src="' + (away.logo || "") + '"></span>';
      button.addEventListener("click", function () {
        location.hash = recap.video_id;
      });
      return button;
    }

    function render(recaps, teams) {
      grid.innerHTML = "";
      const byDay = {};
      recaps.forEach(function (recap) {
        (byDay[recap.date] || (byDay[recap.date] = [])).push(recap);
      });
      lastFiveDays().forEach(function (iso) {
        const row = document.createElement("section");
        row.className = "day";
        const label = dateLabel(iso);
        const dateEl = document.createElement("div");
        dateEl.className = "date-label";
        dateEl.innerHTML = label.month + "<span>" + label.day + "</span>";
        const games = document.createElement("div");
        games.className = "games";
        const items = byDay[iso] || [];
        if (!items.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "+";
          games.appendChild(empty);
        } else {
          items.forEach(function (recap) {
            games.appendChild(badge(recap, teams));
          });
        }
        row.appendChild(dateEl);
        row.appendChild(games);
        grid.appendChild(row);
      });
    }

    function closePlayer() {
      if (player && player.stopVideo) player.stopVideo();
      playerHost.innerHTML = "";
      player = undefined;
      layer.style.display = "none";
      cover.style.display = "flex";
      done.style.display = "none";
      if (location.hash) history.replaceState(null, "", location.pathname);
    }

    function openPlayer(videoId) {
      layer.style.display = "block";
      cover.style.display = "flex";
      done.style.display = "none";
      playerHost.innerHTML = "";
      const mount = function () {
        player = new YT.Player("player", {
          videoId: videoId,
          playerVars: {
            autoplay: 1,
            controls: 1,
            modestbranding: 1,
            rel: 0,
            fs: 1,
            iv_load_policy: 3,
            playsinline: 1,
            origin: location.origin
          },
          events: {
            onReady: function (event) {
              event.target.playVideo();
              window.setTimeout(function () {
                cover.style.display = "none";
              }, 4500);
            },
            onStateChange: function (event) {
              if (event.data === YT.PlayerState.ENDED) {
                playerHost.innerHTML = "";
                cover.style.display = "none";
                done.style.display = "flex";
              }
            }
          }
        });
      };
      if (ytReady) mount();
      else window._pendingPlayer = mount;
    }

    function onHash() {
      const videoId = (location.hash || "").replace(/^#/, "").split("&")[0];
      if (videoId) openPlayer(videoId);
      else closePlayer();
    }

    back.addEventListener("click", function () {
      closePlayer();
    });
    window.addEventListener("hashchange", onHash);

    window.onYouTubeIframeAPIReady = function () {
      ytReady = true;
      if (window._pendingPlayer) window._pendingPlayer();
    };

    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    Promise.all([
      fetch("recaps.json", { cache: "no-store" }).then(function (r) { return r.json(); }),
      fetch("teams.json", { cache: "no-store" }).then(function (r) { return r.json(); })
    ]).then(function (results) {
      render(results[0].recaps || [], results[1] || {});
      onHash();
    }).catch(function () {
      render([], {});
      onHash();
    });
  </script>
</body>
</html>
